<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - EcoCycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              350: '#b2c1d3',
              450: '#8ca1b9',
              655: '#4b5e78',
              850: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', 'Inter', sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-150 transition-colors duration-200">
  <div id="navbar-container"></div>
  
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex items-center justify-center">
    <div class="max-w-lg w-full mx-auto py-8 flex flex-col justify-center fade-in">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
          <div class="inline-flex p-3 bg-emerald-500/10 rounded-2xl">
            <i data-lucide="leaf" class="w-8 h-8 text-emerald-500"></i>
          </div>
          <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Create Account</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">
            Sign up to start recycling plastic and logging environmental impacts.
          </p>
        </div>

        <!-- Error Notification -->
        <div id="error-callout" class="p-3 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-800 rounded-2xl flex items-center space-x-2 text-xs font-semibold text-red-600 dark:text-red-400 hidden">
          <i data-lucide="shield-alert" class="w-4 h-4 flex-shrink-0"></i>
          <span id="error-message"></span>
        </div>

        <!-- Form -->
        <form id="register-form" class="space-y-4">
          <!-- Role selector buttons -->
          <div class="space-y-2">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-450 block">Choose Your Character Profile</label>
            <div class="grid grid-cols-3 gap-2.5">
              <button
                type="button"
                id="role-citizen-btn"
                onclick="setRole('citizen')"
                class="role-btn py-2.5 rounded-2xl text-xs font-extrabold border transition-all text-emerald-600 bg-emerald-50 border-emerald-250 dark:bg-emerald-950/30 dark:border-emerald-900 dark:text-emerald-400"
              >
                Citizen
              </button>
              <button
                type="button"
                id="role-collector-btn"
                onclick="setRole('collector')"
                class="role-btn py-2.5 rounded-2xl text-xs font-extrabold border transition-all text-slate-500 border-slate-200 hover:bg-slate-50 dark:border-slate-800 dark:text-slate-450 dark:hover:bg-slate-850"
              >
                NGO Officer
              </button>
              <button
                type="button"
                id="role-municipal-btn"
                onclick="setRole('municipal')"
                class="role-btn py-2.5 rounded-2xl text-xs font-extrabold border transition-all text-slate-500 border-slate-200 hover:bg-slate-50 dark:border-slate-800 dark:text-slate-450 dark:hover:bg-slate-850"
              >
                Municipal Officer
              </button>
            </div>
          </div>

          <!-- Name -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Full Name / Org Name</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
              <input
                type="text"
                id="name"
                required
                placeholder="Ramesh Kumar"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Email -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Email Address</label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
              <input
                type="email"
                id="email"
                required
                placeholder="ramesh@ecocycle.com"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
              <input
                type="password"
                id="password"
                required
                placeholder="••••••••"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Phone Number -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Phone Number</label>
            <div class="relative">
              <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
              <input
                type="tel"
                id="phoneNumber"
                required
                placeholder="9876543210"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- City & Area Grid -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-455">City</label>
              <div class="relative">
                <i data-lucide="building" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                <input
                  type="text"
                  id="city"
                  required
                  placeholder="Mumbai"
                  class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
                />
              </div>
            </div>

            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Area / Neighborhood</label>
              <div class="relative">
                <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                <input
                  type="text"
                  id="area"
                  required
                  placeholder="Andheri"
                  class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
                />
              </div>
            </div>
          </div>

          <!-- Address -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Street Address</label>
            <div class="relative">
              <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
              <input
                type="text"
                id="address"
                placeholder="101, Green Heights, SV Road"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
              />
            </div>
          </div>

          <!-- Recycler Specific Fields (Hidden by default) -->
          <div id="recycler-fields" class="space-y-4 hidden border-t border-slate-100 dark:border-slate-800 pt-4">
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Facility Name</label>
              <div class="relative">
                <i data-lucide="building" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                <input
                  type="text"
                  id="facilityName"
                  placeholder="Mumbai Industrial Plastic Works"
                  class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
                />
              </div>
            </div>

            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-455">Processing Capacity (kg/month)</label>
              <div class="relative">
                <input
                  type="number"
                  id="capacity"
                  value="10000"
                  class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white"
                />
              </div>
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-emerald-450 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg shadow-emerald-500/10 flex items-center justify-center space-x-2 text-sm mt-6"
          >
            <span>Sign Up</span>
          </button>
        </form>

        <!-- Redirect -->
        <div class="text-center text-xs text-slate-500 dark:text-slate-450 pt-2">
          Already have an account? 
          <a href="login.html" class="text-emerald-500 font-extrabold hover:underline">
            Sign in instead
          </a>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    let activeRole = 'citizen';

    function setRole(role) {
      activeRole = role;
      
      // Update Tab Styles
      const roles = ['citizen', 'collector', 'municipal'];
      roles.forEach(r => {
        const btn = document.getElementById(`role-${r}-btn`);
        if (btn) {
          if (r === role) {
            btn.className = "role-btn py-2.5 rounded-2xl text-xs font-extrabold border transition-all text-emerald-600 bg-emerald-50 border-emerald-250 dark:bg-emerald-950/30 dark:border-emerald-900 dark:text-emerald-400";
          } else {
            btn.className = "role-btn py-2.5 rounded-2xl text-xs font-extrabold border transition-all text-slate-500 border-slate-200 hover:bg-slate-50 dark:border-slate-800 dark:text-slate-455 dark:hover:bg-slate-850";
          }
        }
      });

      // Recycler fields are no longer needed on this signup
      const recyclerFields = document.getElementById('recycler-fields');
      if (recyclerFields) {
        recyclerFields.classList.add('hidden');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phoneNumber = document.getElementById('phoneNumber').value;
      const city = document.getElementById('city').value;
      const area = document.getElementById('area').value;
      const address = document.getElementById('address').value;
      const facilityName = document.getElementById('facilityName').value;
      const capacity = document.getElementById('capacity').value;

      const errorCallout = document.getElementById('error-callout');
      const errorMessage = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      errorCallout.classList.add('hidden');

      if (!name || !email || !password || !phoneNumber || !city || !area) {
        errorMessage.innerText = 'Please fill in all standard required fields.';
        errorCallout.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
        </svg>
        <span>Signing up...</span>
      `;

      try {
        const payload = {
          name,
          email,
          password,
          role: activeRole,
          phoneNumber,
          address,
          city,
          area
        };

        const response = await window.api.auth.register(payload);
        // Automatically log the user in after successful signup
        window.auth.login(response.token, response.user);
        window.auth.redirectToDashboard(response.user.role);
      } catch (err) {
        errorMessage.innerText = err.message || 'Registration failed. Email might already exist.';
        errorCallout.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign Up</span>';
        if (window.lucide) window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
