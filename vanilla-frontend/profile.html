<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - EcoCycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              350: '#b2c1d3',
              450: '#8ca1b9',
              655: '#4b5e78',
              850: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', 'Inter', sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-150 transition-colors duration-200">
  <div id="navbar-container"></div>
  
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-3xl mx-auto space-y-8 py-4 fade-in">
      <div class="space-y-1">
        <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white flex items-center space-x-2">
          <i data-lucide="edit-3" class="w-6 h-6 text-emerald-500"></i>
          <span>My Profile Settings</span>
        </h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Modify contact information and role configurations in the portal.
        </p>
      </div>

      <!-- Success / Error callouts -->
      <div id="success-callout" class="p-4 bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-800 rounded-2xl flex items-center space-x-2 text-xs font-semibold text-emerald-600 dark:text-emerald-450 hidden">
        <i data-lucide="shield-check" class="w-5 h-5 flex-shrink-0"></i>
        <span id="success-message">Profile settings saved successfully.</span>
      </div>

      <div id="error-callout" class="p-4 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-800 rounded-2xl flex items-center space-x-2 text-xs font-semibold text-red-600 dark:text-red-450 hidden">
        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
        <span id="error-message"></span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
        <!-- Profile Card Summary -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-sm text-center space-y-4">
          <div class="relative inline-block mx-auto">
            <img 
              id="summary-pic"
              src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" 
              alt="User"
              class="w-24 h-24 rounded-3xl object-cover mx-auto ring-4 ring-emerald-500/20"
            />
          </div>
          <div>
            <h3 class="font-extrabold text-slate-800 dark:text-white text-base" id="summary-name">User</h3>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" id="summary-role">citizen</span>
          </div>

          <div class="border-t border-slate-100 dark:border-slate-800 pt-4 text-xs text-left space-y-2 text-slate-500 dark:text-slate-400">
            <!-- Dynamic stats detail -->
            <div id="role-metric-container"></div>
            
            <div class="flex justify-between items-center pt-2">
              <span class="font-bold flex items-center space-x-1.5"><i data-lucide="mail" class="w-3.5 h-3.5"></i> <span>Email:</span></span>
              <span class="font-medium truncate max-w-[120px]" id="summary-email">user@ecocycle.com</span>
            </div>
          </div>
        </div>

        <!-- Profile Settings form -->
        <form id="profile-form" class="md:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-8 rounded-3xl space-y-6 shadow-sm">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- Full Name -->
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Full Name</label>
              <input
                type="text"
                id="name"
                required
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>

            <!-- Phone Number -->
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Phone Number</label>
              <input
                type="tel"
                id="phoneNumber"
                required
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>

            <!-- City -->
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">City</label>
              <input
                type="text"
                id="city"
                required
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>

            <!-- Area -->
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Area</label>
              <input
                type="text"
                id="area"
                required
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>
          </div>

          <!-- Street Address -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Street Address</label>
            <input
              type="text"
              id="address"
              class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
            />
          </div>

          <!-- Avatar Image URL -->
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Profile Picture URL</label>
            <div class="relative">
              <i data-lucide="image" class="w-4 h-4 text-slate-400 absolute left-3.5 top-4"></i>
              <input
                type="url"
                id="profilePicture"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>
          </div>

          <!-- Recycler fields (Conditional) -->
          <div id="recycler-fields" class="space-y-4 hidden border-t border-slate-100 dark:border-slate-800 pt-4">
            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Facility Name</label>
              <input
                type="text"
                id="facilityName"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>

            <div class="space-y-1.5">
              <label class="text-xs font-bold text-slate-655 dark:text-slate-400">Processing Capacity (kg/month)</label>
              <input
                type="number"
                id="capacity"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 transition text-slate-900 dark:text-white font-medium"
              />
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl transition shadow-md shadow-emerald-500/10 text-xs flex items-center justify-center space-x-2"
          >
            <span>Save Settings</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = window.auth.getUser();
      if (!user) return;

      // Populate summary card
      document.getElementById('summary-name').innerText = user.name;
      document.getElementById('summary-role').innerText = user.role;
      document.getElementById('summary-email').innerText = user.email;
      if (user.profilePicture) document.getElementById('summary-pic').src = user.profilePicture;

      // Populate Form Fields
      document.getElementById('name').value = user.name || '';
      document.getElementById('phoneNumber').value = user.phoneNumber || '';
      document.getElementById('city').value = user.city || '';
      document.getElementById('area').value = user.area || '';
      document.getElementById('address').value = user.address || '';
      document.getElementById('profilePicture').value = user.profilePicture || '';

      // Populate role-specific metrics
      const container = document.getElementById('role-metric-container');
      if (user.role === 'citizen') {
        container.innerHTML = `
          <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-850 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="font-semibold text-slate-450">Eco Rewards:</span>
            <span class="font-extrabold text-emerald-500">${user.rewards?.points || 0} pts</span>
          </div>
        `;
      } else if (user.role === 'collector') {
        container.innerHTML = `
          <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-850 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="font-semibold text-slate-450">Total Earnings:</span>
            <span class="font-extrabold text-emerald-500">₹${user.collectorDetails?.earnings || 0}</span>
          </div>
          <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-850 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 mt-2">
            <span class="font-semibold text-slate-450">Completed Jobs:</span>
            <span class="font-extrabold text-emerald-500">${user.collectorDetails?.completedJobsToday || 0} today</span>
          </div>
        `;
      } else if (user.role === 'recycler') {
        container.innerHTML = `
          <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-850 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
            <span class="font-semibold text-slate-450">Processing Cap:</span>
            <span class="font-extrabold text-emerald-500">${user.recyclerDetails?.capacity || 10000} kg/month</span>
          </div>
        `;

        // Show Recycler specific inputs
        document.getElementById('recycler-fields').classList.remove('hidden');
        document.getElementById('facilityName').value = user.recyclerDetails?.facilityName || '';
        document.getElementById('capacity').value = user.recyclerDetails?.capacity || 10000;
      }

      if (window.lucide) window.lucide.createIcons();
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const successBox = document.getElementById('success-callout');
      const errorBox = document.getElementById('error-callout');
      const errorMsg = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      successBox.classList.add('hidden');
      errorBox.classList.add('hidden');

      const name = document.getElementById('name').value;
      const phoneNumber = document.getElementById('phoneNumber').value;
      const city = document.getElementById('city').value;
      const area = document.getElementById('area').value;
      const address = document.getElementById('address').value;
      const profilePicture = document.getElementById('profilePicture').value;

      if (!name || !phoneNumber || !city || !area) {
        errorMsg.innerText = 'Please fill in all standard required fields.';
        errorBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Saving changes...';

      const payload = {
        name,
        phoneNumber,
        city,
        area,
        address,
        profilePicture
      };

      const user = window.auth.getUser();
      if (user.role === 'recycler') {
        payload.facilityName = document.getElementById('facilityName').value;
        payload.capacity = document.getElementById('capacity').value;
      }

      try {
        const updatedUser = await window.api.auth.updateProfile(payload);
        window.auth.updateUserProfile(updatedUser);
        
        // Refresh summary card display
        document.getElementById('summary-name').innerText = updatedUser.name;
        if (updatedUser.profilePicture) document.getElementById('summary-pic').src = updatedUser.profilePicture;
        
        // Re-inject layout navbar to reflect name changes instantly
        renderNavbar();
        
        successBox.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        errorMsg.innerText = err.message || 'Failed to update profile settings.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save Settings';
      }
    });
  </script>
</body>
</html>
